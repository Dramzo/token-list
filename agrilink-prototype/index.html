<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AgriLink - Prototype mobile-first</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>AgriLink</h1>
        <p>Marketplace agricole - Mauritanie</p>
      </div>
      <button id="switchRole" class="secondary">Mode Acheteur</button>
    </header>

    <main>
      <section class="card" id="authCard">
        <h2>Connexion rapide (prototype)</h2>
        <div class="grid-2">
          <label>Nom complet <input id="name" placeholder="Ex: Mariem Diallo" /></label>
          <label>Téléphone <input id="phone" placeholder="+222 36 00 00 00" /></label>
          <label>Ville
            <select id="city">
              <option>Nouakchott</option><option>Selibaby</option><option>Kaédi</option>
              <option>Boutlimit</option><option>Rosso</option><option>Atar</option><option>Chinguetti</option>
            </select>
          </label>
          <label>Type de compte
            <select id="role"><option value="buyer">Acheteur</option><option value="seller">Vendeur</option></select>
          </label>
        </div>
        <button id="login">Se connecter</button>
      </section>

      <section id="dashboard" class="card hidden"></section>

      <section class="card hidden" id="catalog">
        <h2>Catalogue produits</h2>
        <div class="grid-2">
          <label>Recherche <input id="q" placeholder="tomate, riz, lait..." /></label>
          <label>Catégorie
            <select id="categoryFilter"><option value="">Toutes</option></select>
          </label>
          <label>Ville
            <select id="cityFilter"><option value="">Toutes</option></select>
          </label>
          <label>Tri
            <select id="sort">
              <option value="recent">Plus récent</option>
              <option value="priceAsc">Prix croissant</option>
              <option value="priceDesc">Prix décroissant</option>
            </select>
          </label>
        </div>
        <div id="products" class="list"></div>
      </section>

      <section class="card hidden" id="offersSection">
        <h2>Mes offres / négociation</h2>
        <div id="offers" class="list"></div>
      </section>

      <section class="card hidden" id="messagesSection">
        <h2>Messagerie</h2>
        <div id="threads" class="list"></div>
      </section>

      <section class="card hidden" id="favoritesSection">
        <h2>Favoris</h2>
        <div id="favorites" class="list"></div>
      </section>
    </main>

    <dialog id="offerDialog">
      <form method="dialog" id="offerForm">
        <h3>Faire une offre</h3>
        <p id="offerProduct"></p>
        <label>Montant proposé (MRU)
          <input required type="number" min="1" id="offerAmount" />
        </label>
        <label>Quantité demandée
          <input required type="number" min="1" id="offerQty" />
        </label>
        <label>Message (optionnel)
          <textarea id="offerMsg"></textarea>
        </label>
        <menu>
          <button value="cancel" class="secondary">Annuler</button>
          <button id="submitOffer" value="default">Envoyer</button>
        </menu>
      </form>
    </dialog>

    <script src="./app.js"></script>
  </body>
</html>
